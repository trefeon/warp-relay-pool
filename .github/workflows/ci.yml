name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action reads the PR commit list on pull_request events.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: JS syntax check
        run: |
          node --check server.mjs
          node --check keep-cold.mjs

      # On this runner /bin/sh is dash, so `sh -n` doubles as the POSIX gate.
      - name: Shell syntax check (dash via sh, plus bash for the test suite)
        run: |
          for f in generate-compose.sh setup.sh get-status.sh logwatch.sh \
                   logwatch.test.sh warp-lite/entrypoint.sh; do
            echo "sh -n $f"
            sh -n "$f"
          done
          bash -n logwatch.test.sh

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error generate-compose.sh setup.sh get-status.sh \
            logwatch.sh logwatch.test.sh warp-lite/entrypoint.sh

      - name: Compose generation is deterministic
        run: |
          sh ./generate-compose.sh 10
          git diff --exit-code docker-compose.yml

      - name: Compose file validates
        run: docker compose config -q

      - name: warp-lite image builds
        run: docker build -t warp-lite:ci ./warp-lite

      # The relay image is COPY-baked: a module the server imports but the
      # Dockerfile does not copy crash-loops the container at deploy time, and
      # `node --check` cannot see that.
      - name: relay image builds
        run: docker build -t warp-relay:ci .

      - name: Install relay deps (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Logwatch test suite
        run: bash logwatch.test.sh

      - name: Relay + keep-cold tests
        run: node --test test/*.test.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
