# Generated by ./generate-compose.sh — do not hand-edit.
# Regenerate: ./generate-compose.sh 10   (COUNT 1..64, default 10)
# Topology: bridge 10.244.0.0/16, relay app fixed at 10.244.0.100.
# warp-N raw SOCKS5 proxy on 127.0.0.1:<10800+N> (override bind: WARP_BIND),
# relay router (mesh-VPN ingress) on 127.0.0.1:3101-3110 (override bind: INGRESS_BIND).
# Relay app env (RELAY_COUNT, BASE_PORT, RELAY_ALLOWED_TARGETS, LIVE_SIGNALS,
# LIVE_SIGNAL_FILE) is baked from the generation-time environment / .env —
# regenerate after editing either.
# The relay app bind-mounts ./.keep-cold at /signals so its 429 signal file
# lands in the same directory the host keep-cold reads (LIVE_SIGNALS=1).
networks:
  default:
    ipam:
      config:
        - subnet: 10.244.0.0/16

services:
  warp-1:
    image: warp-lite:latest
    build: ./warp-lite
    container_name: warp-relay-warp-1
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    environment:
      - ALLOW_NO_AUTH=1
    volumes:
      - warp-data-1:/etc/wireguard
    mem_limit: 32M
    mem_reservation: 8M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:10801:1080"

